name: Crucibles Selector
type: script
_id: SelectCrucEn01
author: Dl5Tvf37OuEHwdAh
img: icons/svg/dice-target.svg
scope: global
command: >-
  // Dialog to choose a Crucible and execute the macro "GM Crucible" with the correct parameters

  const gmMacroName = "GM Crucible";

  const crucibles = [
    { id: "gm-en", label: "GM Crucible", table1: "GM Crucible 1", table2: "GM Crucible 2", title: "GM Crucible", compendium: "grimwild-action.crucibles" },
    { id: "dangers-en", label: "Dangers Crucible", table1: "Dangers Crucible 1", table2: "Dangers Crucible 2", title: "Dangers Crucible", compendium: "grimwild-action.crucibles" },
    { id: "building-en", label: "Building Crucible", table1: "Building Crucible 1", table2: "Building Crucible 2", title: "Building Crucible", compendium: "grimwild-action.crucibles" },
    { id: "barrier-en", label: "Barrier Crucible", table1: "Barrier Crucible 1", table2: "Barrier Crucible 2", title: "Barrier Crucible", compendium: "grimwild-action.crucibles" },
    { id: "sites-en", label: "Sites Crucible", table1: "Sites Crucible 1", table2: "Sites Crucible 2", title: "Sites Crucible", compendium: "grimwild-action.crucibles" },
    { id: "settlement-en", label: "Settlement Crucible", table1: "Settlement Crucible 1", table2: "Settlement Crucible 2", title: "Settlement Crucible", compendium: "grimwild-action.crucibles" },
    { id: "factions-en", label: "Factions Crucible", table1: "Factions Crucible 1", table2: "Factions Crucible 2", title: "Factions Crucible", compendium: "grimwild-action.crucibles" },
    { id: "curiosities-en", label: "Curiosities Crucible", table1: "Curiosities Crucible 1", table2: "Curiosities Crucible 2", title: "Curiosities Crucible", compendium: "grimwild-action.crucibles" }
  ];

  const options = crucibles.map((c) => `<option value="${c.id}">${c.label}</option>`).join("");

  const dialogContent = `
    <form class="crucible-selector">
      <div class="form-group">
        <label>Select crucible</label>
        <select name="crucible">${options}</select>
      </div>
    </form>
  `;

  async function getGmMacro() {
    const fromWorld = game.macros.getName(gmMacroName);
    if (fromWorld) return fromWorld;

    const packKey = "grimwild-action.macros";
    const pack = game.packs.get(packKey);
    if (!pack) {
      ui.notifications.error(`Could not find macros compendium "${packKey}".`);
      return null;
    }
    await pack.getIndex();
    const entry = pack.index.find((e) => e.name === gmMacroName);
    if (!entry) {
      ui.notifications.error(`Could not find macro "${gmMacroName}" in compendium "${packKey}".`);
      return null;
    }
    return pack.getDocument(entry._id);
  }

  new Dialog({
    title: "Crucibles Selector",
    content: dialogContent,
    buttons: {
      roll: {
        label: "Roll",
        callback: async (html) => {
          const choiceId = html.find('[name="crucible"]').val();
          const chosen = crucibles.find((c) => c.id === choiceId) ?? crucibles[0];

          const gmMacro = await getGmMacro();
          if (!gmMacro) {
            return;
          }

          const options = {
            table1: chosen.table1,
            table2: chosen.table2,
            compendium: chosen.compendium,
            title: chosen.title
          };

          globalThis.__gmCrucibleOptions = {
            table1Name: options.table1,
            table1: options.table1,
            table2Name: options.table2,
            table2: options.table2,
            compendiumName: options.compendium,
            compendium: options.compendium,
            title: options.title,
            name: options.title
          };

          return gmMacro.execute();
        }
      },
      cancel: {
        label: "Cancel"
      }
    },
    default: "roll"
  }).render(true);
