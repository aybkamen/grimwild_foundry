name: Selector de Crisol
type: script
_id: SelectCruc01
author: Dl5Tvf37OuEHwdAh
img: icons/svg/dice-target.svg
scope: global
command: >-
  // Dialogo para elegir un Crisol y ejecutar la macro "Crisol del GM" con los parametros adecuados

  const gmMacroName = "Crisol del GM";

  const crucibles = [
    { id: "gm-es", label: "Crisol del GM", table1: "Crisol del GM 1", table2: "Crisol del GM 2", title: "Crisol del GM", compendium: "grimwild-action.crucibles" },
    { id: "peligros-es", label: "Crisol de Peligros", table1: "Crisol de Peligros 1", table2: "Crisol de Peligros 2", title: "Crisol de Peligros", compendium: "grimwild-action.crucibles" },
    { id: "sitios-es", label: "Crisol de Sitios", table1: "Crisol de Sitios 1", table2: "Crisol de Sitios 2", title: "Crisol de Sitios", compendium: "grimwild-action.crucibles" },
    { id: "asentamientos-es", label: "Crisol de Asentamientos", table1: "Crisol de Asentamientos 1", table2: "Crisol de Asentamientos 2", title: "Crisol de Asentamientos", compendium: "grimwild-action.crucibles" },
    { id: "barreras-es", label: "Crisol de Barreras", table1: "Crisol de Barreras 1", table2: "Crisol de Barreras 2", title: "Crisol de Barreras", compendium: "grimwild-action.crucibles" },
    { id: "facciones-es", label: "Crisol de Facciones", table1: "Crisol de Facciones 1", table2: "Crisol de Facciones 2", title: "Crisol de Facciones", compendium: "grimwild-action.crucibles" },
    { id: "curiosidades-es", label: "Crisol de Curiosidades", table1: "Crisol de Curiosidades 1", table2: "Crisol de Curiosidades 2", title: "Crisol de Curiosidades", compendium: "grimwild-action.crucibles" },
    { id: "edificios-es", label: "Crisol de Edificios", table1: "Crisol de Edificios 1", table2: "Crisol de Edificios 2", title: "Crisol de Edificios", compendium: "grimwild-action.crucibles" }
  ];

  const options = crucibles.map((c) => `<option value="${c.id}">${c.label}</option>`).join("");

  const dialogContent = `
    <form class="crucible-selector">
      <div class="form-group">
        <label>Selecciona crisol</label>
        <select name="crucible">${options}</select>
      </div>
    </form>
  `;

  async function getGmMacro() {
    const fromWorld = game.macros.getName(gmMacroName);
    if (fromWorld) return fromWorld;

    const packKey = "grimwild-action.macros";
    const pack = game.packs.get(packKey);
    if (!pack) {
      ui.notifications.error(`No se encontro el compendio de macros "${packKey}".`);
      return null;
    }
    await pack.getIndex();
    const entry = pack.index.find((e) => e.name === gmMacroName);
    if (!entry) {
      ui.notifications.error(`No se encontro la macro "${gmMacroName}" en el compendio "${packKey}".`);
      return null;
    }
    return pack.getDocument(entry._id);
  }

  new Dialog({
    title: "Selector de Crisol",
    content: dialogContent,
    buttons: {
      roll: {
        label: "Tirar",
        callback: async (html) => {
          const choiceId = html.find('[name="crucible"]').val();
          const chosen = crucibles.find((c) => c.id === choiceId) ?? crucibles[0];

          const gmMacro = await getGmMacro();
          if (!gmMacro) {
            return;
          }

          const options = {
            table1: chosen.table1,
            table2: chosen.table2,
            compendium: chosen.compendium,
            title: chosen.title
          };

          // Guardamos opciones en un flag global para que el macro las lea
          globalThis.__gmCrucibleOptions = {
            table1Name: options.table1,
            table1: options.table1,
            table2Name: options.table2,
            table2: options.table2,
            compendiumName: options.compendium,
            compendium: options.compendium,
            title: options.title,
            name: options.title
          };

          return gmMacro.execute(); // sin args para que no se pisen
        }
      },
      cancel: {
        label: "Cancelar"
      }
    },
    default: "roll"
  }).render(true);
