command: |-
  // Macro to roll two different rolltables from a compendium called "crucibles"
  // Accepts optional params (positional or object): table1Name, table2Name, compendiumName, title


  // Foundry pasa args como array; execute(scope, opciones) deja scope en arguments[0] y opciones en arguments[1]
  const hasArgs = typeof args !== "undefined";
  const rawArgs = hasArgs ? args : [];
  const rawArguments = typeof arguments !== "undefined" ? Array.from(arguments) : [];

  const globalOptions = typeof globalThis !== "undefined" ? globalThis.__gmCrucibleOptions : null;

  const options =
    (globalOptions && typeof globalOptions === "object" ? globalOptions : null) ||
    (hasArgs && Array.isArray(rawArgs) && typeof rawArgs[0] === "object" ? rawArgs[0] : null) ||
    (hasArgs && !Array.isArray(rawArgs) && rawArgs && typeof rawArgs === "object" ? rawArgs : null) ||
    (rawArguments.length > 1 && typeof rawArguments[1] === "object" ? rawArguments[1] : null) ||
    (rawArguments.length > 0 && typeof rawArguments[0] === "object" ? rawArguments[0] : null) ||
    {};

  const rolltable1Name = options.table1Name ?? options.table1 ?? "GM Crucible 1";

  const rolltable2Name = options.table2Name ?? options.table2 ?? "GM Crucible 2";

  const compendiumName =
    options.compendiumName ?? options.compendium ?? "grimwild-action.crucibles"; // Adjust to the correct namespace for your system

  const crucibleTitle = options.title ?? options.name ?? "GM Crucible";
  // Function to roll a table by name

  async function rollTable(compendiumName, tableName) {
    // Load the compendium
    const compendium = game.packs.get(compendiumName);
    if (!compendium) {
      ui.notifications.error(`Compendium "${compendiumName}" not found.`);
      return;
    }

    // Ensure the compendium is loaded
    await compendium.getIndex();

    // Find the rolltable entry by name
    const tableEntry = compendium.index.find((e) => e.name === tableName);
    if (!tableEntry) {
      ui.notifications.error(`RollTable "${tableName}" not found in compendium "${compendiumName}".`);
      return;
    }

    // Get the full rolltable document
    const table = await compendium.getDocument(tableEntry._id);
    if (!table) {
      ui.notifications.error(`Failed to load RollTable "${tableName}".`);
      return;
    }

    // Roll the table
    const rollResult = await table.roll();
    const resultText = rollResult.results
      .map((r) => r.text)
      .join(", "); // Combine results if multiple
    
    return resultText;

  }


  // Roll both tables

  const result1 = await rollTable(compendiumName, rolltable1Name);
  const result2 = await rollTable(compendiumName, rolltable2Name);

  // Limpiar opciones globales si las pusimos desde el selector
  if (globalThis.__gmCrucibleOptions) {
    delete globalThis.__gmCrucibleOptions;
  }

  if (result1 && result2) {
    ChatMessage.create({
      content: `<b>${crucibleTitle}</b><br><i>Pick two and smash them together</i><br><b>${result1}</b><br><b>${result2}</b>`
    });
  }
