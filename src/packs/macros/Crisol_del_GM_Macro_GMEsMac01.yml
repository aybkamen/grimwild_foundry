name: Crisol del GM
type: script
_id: GMEsMac01
author: Dl5Tvf37OuEHwdAh
img: icons/svg/dice-target.svg
scope: global
command: >-
  // Macro para tirar el Crisol del GM (dos tablas) y mostrar el resultado
  // Acepta parametros opcionales (posicionales u objeto): table1Name, table2Name, compendiumName, title


  const macroArgs = typeof args !== "undefined" ? args : [];
  const esObjetoOpciones = macroArgs[0] && typeof macroArgs[0] === "object" && !Array.isArray(macroArgs[0]);
  const opciones = esObjetoOpciones ? macroArgs[0] : {};

  const rolltable1Name =
    opciones.table1Name ?? opciones.table1 ?? (!esObjetoOpciones ? macroArgs[0] : undefined) ?? "Crisol del GM 1";

  const rolltable2Name =
    opciones.table2Name ?? opciones.table2 ?? (!esObjetoOpciones ? macroArgs[1] : undefined) ?? "Crisol del GM 2";

  const compendiumName =
    opciones.compendiumName ??
    opciones.compendium ??
    (!esObjetoOpciones ? macroArgs[2] : undefined) ??
    "grimwild-action.crucibles";

  const tituloCrisol =
    opciones.title ?? opciones.name ?? opciones.titulo ?? (!esObjetoOpciones ? macroArgs[3] : undefined) ?? "Crisol del GM";


  async function rollTable(compendiumName, tableName) {
    const compendium = game.packs.get(compendiumName);
    if (!compendium) {
      ui.notifications.error(`Compendio "${compendiumName}" no encontrado.`);
      return;
    }

    await compendium.getIndex();

    const tableEntry = compendium.index.find((e) => e.name === tableName);
    if (!tableEntry) {
      ui.notifications.error(`Tabla "${tableName}" no encontrada en "${compendiumName}".`);
      return;
    }

    const table = await compendium.getDocument(tableEntry._id);
    if (!table) {
      ui.notifications.error(`No se pudo cargar la tabla "${tableName}".`);
      return;
    }

    const rollResult = await table.roll();
    return rollResult.results.map((r) => r.text).join(", ");
  }


  const result1 = await rollTable(compendiumName, rolltable1Name);
  const result2 = await rollTable(compendiumName, rolltable2Name);

  if (result1 && result2) {
    ChatMessage.create({
      content: `<b>${tituloCrisol}</b><br><i>Elige dos y combinalos</i><br><b>${result2}</b><br><b>${result1}</b>`
    });
  }
