img: icons/svg/dice-target.svg
scope: global
command: >-
  // Macro to roll the Barrier Crucible (two rolltables)


  const compendiumName = "grimwild-action.crucibles";
  const rolltable1Name = "Barrier Crucible 1";
  const rolltable2Name = "Barrier Crucible 2";


  async function rollTable(compendiumName, tableName) {
    const compendium = game.packs.get(compendiumName);
    if (!compendium) {
      ui.notifications.error(`Compendium "${compendiumName}" not found.`);
      return;
    }

    await compendium.getIndex();

    const tableEntry = compendium.index.find((e) => e.name === tableName);
    if (!tableEntry) {
      ui.notifications.error(`RollTable "${tableName}" not found in "${compendiumName}".`);
      return;
    }

    const table = await compendium.getDocument(tableEntry._id);
    if (!table) {
      ui.notifications.error(`Failed to load RollTable "${tableName}".`);
      return;
    }

    const rollResult = await table.roll();
    return rollResult.results.map((r) => r.text).join(", ");
  }


  const result1 = await rollTable(compendiumName, rolltable1Name);
  const result2 = await rollTable(compendiumName, rolltable2Name);

  if (result1 && result2) {
    const whisperTo = ChatMessage.getWhisperRecipients("GM").map((u) => u.id);
    ChatMessage.create({
      content: `<b>Barrier Crucible</b><br><i>Roll one on each table and smash them together</i><br><b>${result1}</b><br><b>${result2}</b>`,
      whisper: whisperTo
    });
  }
