    sounds: hooves on dirt, thunderous cheers
    smells: perfumed oil, armor polish, dyes
  pool:
    diceNum: 6
    max: null
  tables:
    - name: Tale of Heroism
      instructions: ''
      table:
        - - Held an army at bay with no rest for a week.
          - Dove into a kraken's mouth to rescue a prince.
          - Blessed by the god of war after winning a duel.
          - Stared down a basilisk and turned it to stone.
          - Killed an evil warlord with just a broken banner.
          - Convinced a hill giant to become a monk.
